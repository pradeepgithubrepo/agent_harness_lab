[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-harness-lab"
version = "0.1.0"
description = "Practical, production-grade agent harness learning examples."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.2,<2.0",
    "langchain-openai>=1.1,<2.0",
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-sqlite>=3.1,<4.0",
    "mcp>=1.30,<2.0",
    "databricks-sdk>=0.80,<1.0",
    "pydantic>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_harness"]
